name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Per uv docs, set up Python with the official action, then install uv.
      # https://docs.astral.sh/uv/guides/integration/github/
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install project and dev dependencies (from lockfile)
        run: uv sync --extra dev --frozen

      - name: Check formatting (ruff format)
        run: uv run --frozen ruff format --check src tests

      - name: Lint (ruff check)
        run: uv run --frozen ruff check src tests

      - name: Run tests
        run: uv run --extra dev --frozen pytest --cov=ocs_submission --cov-report=term-missing

      - name: Type check (mypy)
        run: uv run --frozen mypy src

      - name: Build package
        run: uv build

      - name: Check CLI entry point
        run: uv run --frozen ocs-submission --help

  export-config:
    name: Update config Markdown on main
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Export config Markdown
        run: |
          uv run --frozen python -m ocs_submission.config.config_to_md \
            --input src/ocs_submission/config/config.jsonc \
            --output-dir src/ocs_submission/config/md-export

      - name: Commit config Markdown
        run: |
          git add src/ocs_submission/config/md-export/references.md \
            src/ocs_submission/config/md-export/alignment.md \
            src/ocs_submission/config/md-export/post_alignment.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(config): regenerate reference table, alignment, postqc command Markdown tables"
          git push origin HEAD:main
